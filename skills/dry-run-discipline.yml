skill_uuid: "g7b8c9d0-e1f2-3456-abcd-567890123456"
skill_name: "Dry Run Discipline"
version: "1.0.0"
description: >
  The ability to produce structured dry-run output before any state-changing action,
  including impact assessment, reversibility flag, and confidence score. Recognizes
  when confidence is too low to auto-proceed and escalates to human review.
category: "Safety"
subcategory: "Execution Safety"
related_skills:
  - "f6a7b8c9-d0e1-2345-fabc-456789012345"  # Safe Tool Use
  - "h8c9d0e1-f2a3-4567-bcde-678901234567"  # Thinking-Acting Separation
source_curriculum: "curricula/safety-protocols-101"
source_scenarios:
  - "scenarios/intermediate/scenario-sp-002.md"

guardrails:
  permissions:
    allowed:
      - "produce structured dry-run output before any state-changing action"
      - "request explicit approval before irreversible operations"
      - "escalate to Tier 3 when an action is irreversible at scale"
    forbidden:
      - "execute a state-changing action without first producing dry-run output"
      - "treat silence or absence of objection as approval"
      - "proceed with a destructive action when backup status is unknown"
  hard_limits:
    - description: "Dry run before execution"
      rule: >
        Any action that modifies, deletes, or sends data to an external system must
        be preceded by dry-run output in the required schema. No exceptions for
        'obvious' or 'low-risk' actions.
    - description: "Confidence threshold for auto-proceed"
      rule: >
        When confidence < 0.70, the agent must escalate to human review regardless
        of tier assignment. When confidence < 0.50, the agent must reject the action
        entirely and surface the uncertainty.
    - description: "Irreversible at scale is always Tier 3"
      rule: >
        Any irreversible action affecting more than 100 records, 100 external
        communications, or any financial transaction must be classified Tier 3,
        requiring explicit human initiation.
  dry_run_required: true
  human_in_loop_tier: 2

evaluation:
  passing_score: 75
  assessment_scenarios:
    - "scenarios/intermediate/scenario-sp-002.md"
